<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청남대 웰니스타운 산삼고추장·산삼된장 | 기간 한정 효도 선물 특가</title>
<meta name="description" content="매일 마주하는 밥상에 7년의 건강을 올립니다. 청남대 웰니스타운 산삼 장(醬) 기간 한정 특가.">
<meta property="og:type" content="website">
<meta property="og:title" content="청남대 웰니스타운 산삼고추장·산삼된장 | 기간 한정 효도 선물 특가">
<meta property="og:description" content="매일 마주하는 밥상에 7년의 건강을 올립니다. 청남대 웰니스타운 산삼 장(醬) 기간 한정 특가.">
<meta property="og:image" content="">
<meta name="theme-color" content="#1F3A2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────── 디자인 토큰 ───────── */
:root{
  --paper:#F7F2EA;      /* 오프화이트 */
  --paper-2:#EFE6D8;
  --paper-3:#E5D8C3;
  --card:#FFFCF7;
  --wood:#7A5636;       /* 우드 브라운 */
  --wood-deep:#3B2819;
  --wood-ink:#2A1D13;
  --ink:#2B2119;
  --ink-2:#5D4F43;
  --ink-3:#8E8073;
  --line:#E3D7C4;
  --green:#1F3A2B;      /* 딥 그린 */
  --green-2:#2B4C39;
  --gold:#B39563;       /* 무광 골드 */
  --gold-soft:#D3BE95;
  --persimmon:#A8492C;  /* 할인율 강조 */
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --story:"Gowun Batang","Noto Serif KR",serif;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.75 var(--sans);word-break:keep-all;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 28px}
.center{text-align:center}
.ended .hide-ended{display:none!important}

/* ───────── 초안 안내 · 상단 띠 ───────── */
.draftbar{background:#262019;color:#EBD49B;font-size:13px;text-align:center;padding:9px 16px;line-height:1.5}
.draftbar a{text-decoration:underline;text-underline-offset:3px;margin-left:6px;font-weight:500}
.topbar{position:sticky;top:0;z-index:60;background:var(--green);color:#E6DDC9;font-size:13px;letter-spacing:.02em}
.topbar .wrap{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px;text-align:center}
.topbar b{color:var(--gold-soft);font-weight:500}
.topbar .sep{opacity:.3}
.topbar [data-left]{font-variant-numeric:tabular-nums}

/* ───────── 사진 슬롯 ───────── */
.ph{position:relative;margin:0;overflow:hidden;background:var(--paper-3);border-radius:var(--r)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(90% 80% at 28% 18%,rgba(255,251,243,.75),transparent 60%),linear-gradient(160deg,#EADFCB,#D6C3A4)}
.ph-mark{font-family:var(--serif);font-weight:600;font-size:clamp(56px,9vw,120px);color:rgba(122,86,54,.16);line-height:1;user-select:none}
.ph-note{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(255,252,246,.94);border:1px dashed #B39563;border-radius:var(--r);padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--ink-2);text-align:left;z-index:2}
.ph-note b{display:block;color:var(--wood-deep);font-size:13px;margin-bottom:2px}
.ph-edit{position:absolute;top:12px;right:12px;z-index:4;border:0;background:#1F3A2B;color:#fff;font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.editing .ph{cursor:pointer}
.editing .ph:hover{outline:2px dashed var(--gold);outline-offset:-2px}

/* ───────── 히어로 ───────── */
.hero{position:relative;min-height:min(94vh,920px);display:flex;flex-direction:column;color:#F7F1E6;overflow:hidden;background:var(--wood-deep)}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg .ph{position:absolute;inset:0;border-radius:0;background:var(--wood-deep)}
.hero-bg::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(26,17,10,.84) 0%,rgba(26,17,10,.58) 40%,rgba(26,17,10,.08) 78%),linear-gradient(0deg,rgba(26,17,10,.55),transparent 38%)}
.hero .ph-empty{background:
  radial-gradient(55% 70% at 74% 34%,rgba(255,206,140,.42),transparent 70%),
  radial-gradient(30% 40% at 70% 70%,rgba(255,226,180,.12),transparent 70%),
  linear-gradient(135deg,#3A2617 0%,#5C3E26 55%,#2C1C11 100%)}
.hero .ph-empty::before{content:"";position:absolute;right:0;top:0;bottom:0;width:62%;
  background:repeating-linear-gradient(90deg,rgba(255,232,196,.10) 0 2px,transparent 2px 96px),repeating-linear-gradient(0deg,rgba(255,232,196,.10) 0 2px,transparent 2px 96px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.hero .ph-mark{display:none}
.hero .ph-note{left:auto;right:28px;bottom:28px;max-width:360px}
.hero .ph-edit{top:auto;bottom:28px;right:28px}
.editing .hero .ph-note{bottom:80px}
.hnav,.hero-in,.hero-vert{position:relative;z-index:2}
.hero-in{pointer-events:none}
.hero-in>*{pointer-events:auto}
.hnav{display:flex;justify-content:space-between;align-items:center;padding-top:24px;padding-bottom:24px}
.logo{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.08em;display:flex;align-items:center}
.logo img{height:38px;width:auto;position:static}
.hnav-cta{font-size:14px;border:1px solid rgba(232,214,180,.5);padding:8px 18px;border-radius:999px;transition:background .2s}
.hnav-cta:hover{background:rgba(255,255,255,.08)}
.hero-in{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:16px;padding-bottom:84px}
.hero-in>*{max-width:620px}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.16em;color:var(--gold-soft);margin:0 0 26px}
.eyebrow i{width:40px;height:1px;background:var(--gold-soft)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,5.3vw,62px);line-height:1.34;letter-spacing:-.02em;margin:0 0 24px;text-shadow:0 2px 24px rgba(0,0,0,.25)}
.hero-sub{font-family:var(--story);font-size:clamp(16px,1.75vw,19px);line-height:1.9;color:rgba(247,241,230,.86);margin:0 0 40px}
.hero-deal{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:20px 24px;border:1px solid rgba(211,190,149,.4);background:rgba(24,16,9,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:var(--r);margin-bottom:30px;max-width:580px}
.deal-tag{display:block;font-size:12px;letter-spacing:.14em;color:var(--gold-soft)}
.deal-l strong{display:block;font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.35;margin:2px 0}
.deal-l em{font-style:normal;color:var(--gold-soft);font-size:34px;font-weight:600}
.deal-period{font-size:12.5px;color:rgba(247,241,230,.66)}
.cd-wrap{margin-left:auto;text-align:center}
.cd-cap{display:block;font-size:11.5px;letter-spacing:.1em;color:rgba(247,241,230,.6);margin-bottom:4px}
.cd{display:flex;gap:4px;align-items:flex-start;justify-content:center}
.cd span{display:flex;flex-direction:column;align-items:center;min-width:44px}
.cd b{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.cd small{font-size:11px;opacity:.6;margin-top:3px}
.cd i{font-style:normal;font-family:var(--serif);font-size:22px;opacity:.35;line-height:1.2}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-vert{position:absolute;right:34px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:var(--serif);letter-spacing:.6em;font-size:13px;color:rgba(232,210,170,.55)}

/* ───────── 버튼 ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border-radius:var(--r);font-weight:500;font-size:16px;letter-spacing:.02em;cursor:pointer;border:1px solid transparent;transition:background .2s,color .2s,border-color .2s;text-align:center}
.btn-gold{background:var(--gold);color:#1E140C}
.btn-gold:hover{background:var(--gold-soft)}
.btn-green{background:var(--green);color:#F3EBDD}
.btn-green:hover{background:var(--green-2)}
.btn-line-light{border-color:rgba(232,214,180,.5);color:#F3EBDD}
.btn-line-light:hover{background:rgba(255,255,255,.08)}
.btn-line{border-color:var(--wood);color:var(--wood-deep);background:transparent}
.btn-line:hover{background:rgba(122,86,54,.06)}
.btn-kakao{background:#FEE500;color:#191919}
.btn-kakao:hover{background:#F5DC00}
.btn[disabled]{background:#D3C9BA;color:#857a6e;cursor:not-allowed;border-color:transparent}
.btn-block{width:100%}

/* ───────── 섹션 공통 ───────── */
.sec{padding:clamp(88px,11vw,148px) 0}
.kicker{display:inline-flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.22em;color:var(--wood);font-weight:500;margin:0}
.kicker::before{content:"";width:26px;height:1px;background:currentColor}
.center .kicker::after{content:"";width:26px;height:1px;background:currentColor}
.h2{font-family:var(--serif);font-weight:600;font-size:clamp(28px,3.7vw,44px);line-height:1.42;letter-spacing:-.015em;margin:20px 0 24px}
.lead{font-size:17px;color:var(--ink-2);line-height:1.95;margin:0}

/* 공감 */
.empathy .inner{max-width:740px;margin:0 auto;text-align:center}
.empathy .kicker::after{content:"";width:26px;height:1px;background:currentColor}
.emp-lines{list-style:none;padding:0;margin:52px auto 48px;max-width:480px}
.emp-lines li{font-family:var(--story);font-size:clamp(17px,2vw,21px);color:var(--wood-deep);padding:18px 0;border-bottom:1px solid var(--line)}
.emp-lines li:first-child{border-top:1px solid var(--line)}
.emp-body{font-size:17px;color:var(--ink-2);line-height:2.05;margin:0}
.emp-photo{margin-top:clamp(64px,8vw,96px)}
.ph-wide{aspect-ratio:21/9}
.emp-cap{font-family:var(--story);text-align:center;margin:18px 0 0;color:var(--ink-3);font-size:15px}

/* 솔루션 */
.solution{background:var(--paper-2)}
.sol-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(48px,6.5vw,96px);align-items:center}
.sol-photos{position:relative;padding-bottom:20%}
.sol-photos .ph-a{aspect-ratio:4/5;width:76%}
.sol-photos .ph-b{aspect-ratio:1/1;width:48%;position:absolute;right:0;bottom:0;box-shadow:0 0 0 10px var(--paper-2)}
.sol-text .h2{margin-bottom:20px}
.points{list-style:none;padding:0;margin:40px 0 0}
.points li{display:grid;grid-template-columns:52px 1fr;column-gap:14px;padding:22px 0;border-top:1px solid var(--line)}
.points li:last-child{border-bottom:1px solid var(--line)}
.points .n{font-family:var(--serif);color:var(--gold);font-size:22px;font-weight:600;grid-row:span 2;line-height:1.4}
.points h3{margin:0 0 4px;font-size:18px;font-weight:700;color:var(--wood-ink)}
.points p{margin:0;color:var(--ink-2);font-size:15.5px}
.band{position:relative;margin-top:clamp(88px,10vw,130px);border-radius:var(--r);overflow:hidden}
.band .ph{border-radius:0}
.band-quote{position:absolute;left:0;right:0;bottom:0;margin:0;padding:clamp(28px,5vw,56px);background:linear-gradient(0deg,rgba(26,17,10,.72),transparent);color:#F7F1E6;font-family:var(--story);font-size:clamp(19px,2.6vw,30px);line-height:1.6;z-index:3;pointer-events:none}
.band .ph-note{bottom:auto;top:14px}

/* 상품 */
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:56px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod .ph{aspect-ratio:1/1;border-radius:0}
.prod-b{padding:30px 30px 32px;display:flex;flex-direction:column;gap:12px;flex:1}
.prod h3{font-family:var(--serif);font-size:27px;font-weight:600;margin:0;display:flex;align-items:baseline;gap:10px;color:var(--wood-ink)}
.prod h3 span{font-family:var(--sans);font-size:14px;color:var(--ink-3);font-weight:400}
.prod p{margin:0;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:2px 0 0}
.chips li{font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;color:var(--wood);background:var(--paper)}
.prod-price{margin-top:auto;padding-top:22px;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.prod-price .lbl{display:block;font-size:12px;letter-spacing:.12em;color:var(--ink-3)}
.prod-price s{color:var(--ink-3);font-size:14px}
.prod-price em{font-style:normal;color:var(--persimmon);font-weight:700;font-size:20px;margin-right:10px}
.prod-price strong{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--wood-ink);line-height:1}
.prod-price strong small{font-size:16px;margin-left:2px}

/* 신뢰 */
.trust{background:var(--green);color:#E9E2D3;padding-bottom:clamp(88px,11vw,148px)}
.trust-hero{position:relative}
.trust-hero .ph{aspect-ratio:21/8;border-radius:0;background:#2A4636}
.trust-hero .ph-empty{background:radial-gradient(70% 90% at 50% 0%,rgba(211,190,149,.18),transparent 60%),linear-gradient(180deg,#36574420,#1F3A2B)}
.trust-hero .ph-mark{color:rgba(211,190,149,.18)}
.trust-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(0deg,var(--green),transparent);pointer-events:none;z-index:1}
.trust-hero .ph-note{bottom:auto;top:14px}
.trust-head{max-width:660px;margin:-90px auto 0;position:relative;z-index:2;text-align:center}
.trust .kicker{color:var(--gold-soft)}
.trust .kicker::after{content:"";width:26px;height:1px;background:currentColor}
.trust .h2{color:#F7F1E6}
.trust .lead{color:rgba(233,226,211,.8)}
.specs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(211,190,149,.35);border-bottom:1px solid rgba(211,190,149,.35);margin:64px 0 80px;padding:0}
.spec{padding:34px 18px;text-align:center;border-right:1px solid rgba(211,190,149,.2)}
.spec:last-child{border-right:0}
.spec dt{font-size:13px;letter-spacing:.14em;color:var(--gold-soft)}
.spec dd{margin:10px 0 0;font-family:var(--serif);font-weight:600;font-size:clamp(19px,2vw,23px);color:#F7F1E6;line-height:1.4}
.fac{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(40px,6vw,80px);align-items:center}
.fac .ph{aspect-ratio:4/3;background:#2A4636}
.fac .ph-empty{background:linear-gradient(160deg,#2F5040,#24402F)}
.fac .ph-mark{color:rgba(211,190,149,.16)}
.fac h3{font-family:var(--serif);font-weight:600;font-size:clamp(23px,2.6vw,30px);color:#F7F1E6;margin:0 0 16px;line-height:1.45}
.fac p{margin:0;color:rgba(233,226,211,.8);line-height:1.95}
.badges{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:26px 0 0}
.badges li{border:1px solid rgba(211,190,149,.55);color:var(--gold-soft);font-size:13px;padding:6px 14px;border-radius:999px}

/* 선물 */
.gift{background:var(--wood-deep);color:#EFE7D9}
.gift-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:clamp(48px,6.5vw,96px);align-items:center}
.gift .ph{aspect-ratio:4/5;background:#4A3322}
.gift .ph-empty{background:radial-gradient(80% 70% at 40% 25%,rgba(211,190,149,.2),transparent 60%),linear-gradient(160deg,#55392A,#3B2819)}
.gift .ph-mark{color:rgba(211,190,149,.2)}
.gift .kicker{color:var(--gold-soft)}
.gift .h2{color:#F7F1E6}
.gift .lead{color:rgba(239,231,217,.8)}
.gift-list{list-style:none;padding:0;margin:32px 0}
.gift-list li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(211,190,149,.2);font-size:16px}
.gift-list li:first-child{border-top:1px solid rgba(211,190,149,.2)}
.gift-list li::before{content:"◆";color:var(--gold);font-size:9px;line-height:2.9}
.deliv{border:1px solid rgba(211,190,149,.45);padding:22px 24px;border-radius:var(--r);margin-bottom:30px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.deliv p{margin:0;font-family:var(--story);font-size:18px;color:#F7F1E6;line-height:1.6;flex:1;min-width:220px}
.deliv .cd-wrap{margin-left:0}
.deliv .cd b{font-size:22px}
.deliv .cd span{min-width:36px}

/* 주문 */
.ord-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:44px;align-items:start;margin-top:56px}
.step-h{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;margin:0 0 18px;color:var(--wood-ink)}
.step-h>span{width:30px;height:30px;border-radius:50%;background:var(--green);color:#F3EBDD;font-size:14px;display:grid;place-items:center;flex-shrink:0}
.step-h small{font-weight:400;font-size:13px;color:var(--wood)}
.opt{display:flex;align-items:center;gap:16px;padding:20px 22px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
.opt.on{border-color:var(--wood);box-shadow:inset 3px 0 0 var(--wood)}
.opt-i{flex:1;min-width:0}
.opt-n{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--wood-ink)}
.best{font-size:11px;letter-spacing:.06em;background:var(--green);color:#EFE6D3;padding:2px 8px;border-radius:2px;font-weight:500}
.opt-d{font-size:13.5px;color:var(--ink-3)}
.opt-p{margin-top:4px}
.opt-p em{font-style:normal;color:var(--persimmon);font-weight:700;margin-right:6px}
.opt-p b{font-size:18px}
.opt-p s{color:var(--ink-3);font-size:13px;margin-left:6px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:#fff;flex-shrink:0}
.qty button{width:42px;height:44px;border:0;background:transparent;cursor:pointer;font-size:19px;color:var(--wood-deep)}
.qty button:hover{background:var(--paper)}
.qty output{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.msg{margin-top:48px}
.msg-chips{display:flex;flex-wrap:wrap;gap:8px}
.msg-chip{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:999px;cursor:pointer;font-family:var(--story);font-size:15px;color:var(--ink-2);transition:all .15s}
.msg-chip:hover{border-color:var(--wood)}
.msg-chip[aria-pressed="true"]{background:var(--wood-deep);color:#F7F1E6;border-color:var(--wood-deep)}
.msg-card{margin-top:20px;background:#FFFDF8;padding:36px 28px;text-align:center;position:relative;box-shadow:0 14px 34px rgba(59,40,25,.10);border-radius:2px}
.msg-card::before{content:"";position:absolute;inset:10px;border:1px solid var(--gold-soft);pointer-events:none}
.mc-to{display:block;font-family:var(--story);color:var(--wood);font-size:14px;letter-spacing:.06em;margin-bottom:12px}

<script>
(() => {
'use strict';
// 내려받기용 원본 — 렌더링 전에 잡아 둡니다.
const TEMPLATE = '<!doctype html>\n' + document.documentElement.outerHTML;
const clone = (o) => JSON.parse(JSON.stringify(o));
const ORIGINAL = JSON.parse(document.getElementById('site-data').textContent);
let S = clone(ORIGINAL);
const STORE_KEY = 'cnd-sansam-editor-v1';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const br = (s) => esc(s).replace(/\n/g, '<br>');
// 본문용: 모바일에서는 줄바꿈 없이 자연스럽게 흐르도록
const brSoft = (s) => esc(s).replace(/\n/g, ' <br class="sb">');
const num = (n) => (Number(n) || 0).toLocaleString('ko-KR');
const won = (n) => num(n) + '원';
const pct = (reg, sale) => (reg > 0 && sale < reg ? Math.round((1 - sale / reg) * 100) : 0);
const lines = (a) => (Array.isArray(a) ? a : String(a || '').split('\n')).map((x) => String(x).trim()).filter(Boolean);
const getP = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const setP = (o, p, v) => { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach((k) => { if (a[k] == null) a[k] = {}; a = a[k]; }); a[ks[ks.length - 1]] = v; };

let editing = false;
const showGuides = () => editing || S.draft;
const val = (v) => (String(v ?? '').trim() ? esc(v) : showGuides() ? '<span class="need-tx">[입력 필요]</span>' : '-');

// ───────── 사진 슬롯 정의 ─────────
const SLOTS = {
  hero:      { label: '메인(첫 화면) 사진', hint: '한옥 창가 햇살 + 김이 나는 밥상 위 산삼고추장·된장 · 가로형 16:9, 가로 2000px 이상', mark: '醬', max: 2200 },
  hands:     { label: '공감 섹션 사진', hint: '부모님의 주름진 손이 정갈하게 식사하는 모습 · 와이드 21:9', mark: '食', max: 2000 },
  ginseng:   { label: '산양삼 사진', hint: '흙이 묻은 굵은 산양삼 뿌리 클로즈업 · 세로 4:5', mark: '蔘', max: 1500 },
  jangdok:   { label: '장독대 사진', hint: '햇볕 아래 숨 쉬는 장독대 · 정사각 1:1', mark: '甕', max: 1200 },
  meal:      { label: '밥상 사진', hint: '뚝배기에서 끓는 찌개와 갓 지은 밥 · 와이드 21:9', mark: '飯', max: 2000 },
  gochujang: { label: '산삼고추장 제품 사진', hint: '제품 단독 컷, 밝고 깨끗한 배경 · 정사각 1:1', mark: '醬', max: 1400 },
  doenjang:  { label: '산삼된장 제품 사진', hint: '제품 단독 컷, 밝고 깨끗한 배경 · 정사각 1:1', mark: '醬', max: 1400 },
  nature:    { label: '청남대 풍경 사진', hint: '대청호와 청남대의 깨끗한 자연 · 와이드 21:8', mark: '淸', max: 2200 },
  factory:   { label: '제조 시설 사진', hint: '위생적인 제조·숙성 공간 · 4:3', mark: '誠', max: 1500 },
  gift:      { label: '선물세트 사진', hint: '보자기 포장 또는 나무 상자에 담긴 선물세트 · 세로 4:5', mark: '禮', max: 1500 },
  logo:      { label: '로고 (선택)', hint: '가로형 로고, 배경이 투명한 PNG 권장 · 없으면 브랜드 이름이 글자로 나옵니다', mark: '印', max: 800, png: true },
};

function photo(key, cls = '') {
  const src = (S.photos || {})[key];
  const m = SLOTS[key];
  return `<figure class="ph ${cls}" data-slot="${key}">${
    src ? `<img src="${esc(src)}" alt="${esc(m.label)}"${key === 'hero' ? '' : ' loading="lazy"'}>`
        : `<div class="ph-empty"><span class="ph-mark">${m.mark}</span></div>`
  }${!src && showGuides() ? `<figcaption class="ph-note"><b>📷 ${esc(m.label)}</b>${esc(m.hint)}</figcaption>` : ''}${
    editing ? `<button type="button" class="ph-edit">📷 사진 ${src ? '바꾸기' : '넣기'}</button>` : ''}</figure>`;
}

// ───────── 날짜 (한국 시간) ─────────
const parseKST = (s) => { s = String(s || ''); if (/([zZ]|[+-]\d\d:?\d\d)$/.test(s)) return new Date(s); return new Date((s.length === 16 ? s + ':00' : s) + '+09:00'); };
const kst = (d) => { const k = new Date(d.getTime() + 9 * 36e5); return { M: k.getUTCMonth() + 1, D: k.getUTCDate(), w: '일월화수목금토'[k.getUTCDay()], h: k.getUTCHours(), m: k.getUTCMinutes() }; };
const pad = (n) => String(n).padStart(2, '0');
const fmtD = (d) => { const k = kst(d); return `${k.M}월 ${k.D}일(${k.w})`; };
const fmtT = (d) => { const k = kst(d); return `${pad(k.h)}:${pad(k.m)}`; };
const startD = () => parseKST(S.event.startAt);
const endD = () => parseKST(S.event.endAt);
function eventState() {
  const s = startD(), e = endD(), now = Date.now();
  if (isNaN(s) || isNaN(e)) return 'live';
  return now < s ? 'before' : now > e ? 'ended' : 'live';
}
const period = () => { const s = startD(), e = endD(); return isNaN(s) || isNaN(e) ? '' : `${fmtD(s)} ~ ${fmtD(e)} ${fmtT(e)}까지`; };

// ───────── 가격 계산 ─────────
const prod = (id) => S.products.find((p) => p.id === id) || { regular: 0, sale: 0, name: id };
function optCalc(o) {
  let reg = 0, sale = 0;
  for (const [id, q] of Object.entries(o.items || {})) {
    const p = prod(id), n = Number(q) || 0;
    reg += (Number(p.regular) || 0) * n; sale += (Number(p.sale) || 0) * n;
  }
  if (o.price !== null && o.price !== '' && o.price !== undefined && !isNaN(o.price)) sale = Number(o.price);
  return { reg, sale };
}
const maxPct = () => Math.max(0, ...S.products.map((p) => pct(p.regular, p.sale)), ...S.options.map((o) => { const c = optCalc(o); return pct(c.reg, c.sale); }));

// ───────── 주문 상태 ─────────
const qty = {};
let msgSel = 0, msgCustom = '', msgFrom = '';

// ───────── 섹션 템플릿 ─────────
const cd = (cls = '') => `<div class="cd-wrap ${cls}"><span class="cd-cap" data-cdcap></span><div class="cd" data-cd aria-live="off"><span><b data-u="d">0</b><small>일</small></span><i>:</i><span><b data-u="h">00</b><small>시간</small></span><i>:</i><span><b data-u="m">00</b><small>분</small></span><i>:</i><span><b data-u="s">00</b><small>초</small></span></div></div>`;

const topbar = () => `<div class="topbar"><div class="wrap"><span>◆ <b>${esc(S.event.name)}</b></span><span class="sep tb-p">|</span><span class="tb-p">${period()}</span><span class="sep">|</span><span data-left></span></div></div>`;

function hero(st) {
  const c = S.copy;
  const logo = S.photos.logo ? `<img src="${esc(S.photos.logo)}" alt="${esc(S.brand)}">` : esc(S.brand);
  return `<header class="hero" id="top">
    <div class="hero-bg">${photo('hero')}</div>
    <nav class="hnav wrap"><a class="logo" href="#top">${logo}</a><a class="hnav-cta hide-ended" href="#order">특가 주문하기</a></nav>
    <div class="hero-in wrap">
      <p class="eyebrow"><i></i>${esc(c.heroEyebrow)}</p>
      <h1>${br(c.heroTitle)}</h1>
      <p class="hero-sub">${br(c.heroSub)}</p>
      <div class="hero-deal">
        <div class="deal-l"><span class="deal-tag">${esc(S.event.name)}</span><strong>${st === 'ended' ? '행사가 종료되었습니다' : `최대 <em>${maxPct()}%</em> 할인`}</strong><span class="deal-period">${period()}</span></div>
        ${st === 'ended' ? '' : cd()}
      </div>
      <div class="hero-btns"><a class="btn btn-gold hide-ended" href="#order">${esc(c.heroCta)} <span aria-hidden="true">→</span></a><a class="btn btn-line-light" href="#empathy">이야기 먼저 보기</a></div>
    </div>
    <div class="hero-vert" aria-hidden="true">淸南臺 · 山蔘醬</div>
  </header>`;
}

function empathy() {
  const c = S.copy;
  return `<section class="sec empathy" id="empathy"><div class="wrap">
    <div class="inner rv"><p class="kicker">${esc(c.empathyKicker)}</p><h2 class="h2">${br(c.empathyTitle)}</h2>

}

        <ol class="points">${(c.points || []).map((p, i) => `<li><span class="n">${pad(i + 1)}</span><h3>${esc(p.title)}</h3><p>${br(p.body)}</p></li>`).join('')}</ol></div>
    </div>

function products() {
  const c = S.copy;

        <div class="prod-price"><div><span class="lbl">행사가</span>${pc ? `<s>${won(p.regular)}</s>` : ''}</div><div>${pc ? `<em>${pc}%</em>` : ''}<strong>${num(p.sale)}<small>원</small></strong></div></div>

}

      <div class="fac rv">${photo('factory')}<div><h3>${br(c.factoryTitle)}</h3><p>${brSoft(c.factoryBody)}</p>${badges.length ? `<ul class="badges">${badges.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}</div></div>

}

function gift(st) {
  const c = S.copy;
  return `<section class="sec gift" id="gift"><div class="wrap gift-grid">

        ? `<div class="deliv"><p>이번 행사는 종료되었습니다. 성원에 감사드립니다.</p></div>`
        : `<div class="deliv"><p>${br(S.event.deliveryNotice)}</p>${cd()}</div><a class="btn btn-gold" href="#order">${esc(c.giftCta)} <span aria-hidden="true">→</span></a>`}
    </div>
  </div></section>`;
}

function order(st) {
  const c = S.copy, mc = S.messageCard || {}, presets = lines(mc.presets);
  if (typeof msgSel === 'number' && msgSel >= presets.length) msgSel = presets.length ? 0 : 'custom';
  const sub = st === 'before' ? `${fmtD(startD())}부터 주문하실 수 있습니다.` : st === 'ended' ? '이번 특가 행사는 종료되었습니다. 성원에 감사드립니다.' : '수량을 고르면 결제 금액이 바로 계산됩니다.';
  const opts = S.options.map((o) => {
    const { reg, sale } = optCalc(o), pc = pct(reg, sale), q = qty[o.id] || 0;
    return `<div class="opt${q ? ' on' : ''}" data-opt="${esc(o.id)}"><div class="opt-i">
      <div class="opt-n">${esc(o.name)}${o.best ? '<span class="best">추천</span>' : ''}</div>${o.desc ? `<div class="opt-d">${esc(o.desc)}</div>` : ''}
      <div class="opt-p">${pc ? `<em>${pc}%</em>` : ''}<b>${won(sale)}</b>${pc ? `<s>${won(reg)}</s>` : ''}</div></div>
      ${st === 'live' ? `<div class="qty"><button type="button" data-d="-1" aria-label="${esc(o.name)} 수량 빼기">−</button><output>${q}</output><button type="button" data-d="1" aria-label="${esc(o.name)} 수량 더하기">+</button></div>` : ''}</div>`;
  }).join('');
  const msg = mc.enabled ? `<div class="msg hide-ended"><h3 class="step-h"><span>2</span>마음을 담은 메시지 카드 <small>무료 동봉</small></h3>
      <div class="msg-chips" role="group" aria-label="카드 문구 선택">${presets.map((t, i) => `<button type="button" class="msg-chip" data-msg="${i}" aria-pressed="${msgSel === i}">${esc(t)}</button>`).join('')}
        <button type="button" class="msg-chip" data-msg="custom" aria-pressed="${msgSel === 'custom'}">✎ 직접 쓰기</button>
        <button type="button" class="msg-chip" data-msg="none" aria-pressed="${msgSel === 'none'}">카드 없이</button></div>

// ───────── 렌더링 ─────────
let lastState = null;
function renderAll() {
  const st = eventState(); lastState = st;
  document.body.classList.toggle('ended', st === 'ended');
  document.body.classList.toggle('editing', editing);
  $('#draftbar').hidden = !S.draft || editing;
  $('#app').innerHTML = topbar() + hero(st) + '<main>' + empathy() + solution() + products() + trust() + gift(st) + order(st) + how() + info() + '</main>' + footer() + bottomBar();
  updateHead(document);
  renderSummary(); renderCard(); tick(); reveal(); syncBar();
}

function updateHead(doc) {
  const m = S.meta || {};
  doc.title = m.title || S.brand;
  const set = (sel, v) => { const el = doc.querySelector(sel); if (el) el.setAttribute('content', v || ''); };
  set('meta[name="description"]', m.description);
  set('meta[property="og:title"]', m.title);
  set('meta[property="og:description"]', m.description);
  set('meta[property="og:image"]', /^https?:\/\//.test(m.ogImage || '') ? m.ogImage : '');
}

let io;
function reveal() {
  const els = $$('.rv');
  if (editing || !('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('in')); return; }
  io?.disconnect();
  io = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin: '0px 0px -8% 0px' });
  els.forEach((e) => io.observe(e));
}

// ───────── 주문 계산 ─────────
function totals() {
  const ls = S.options.filter((o) => qty[o.id] > 0).map((o) => { const c = optCalc(o), q = qty[o.id]; return { o, q, sum: c.sale * q, reg: c.reg * q }; });
  const goods = ls.reduce((s, l) => s + l.sum, 0), reg = ls.reduce((s, l) => s + l.reg, 0);
  const fee = Number(S.order.shippingFee) || 0, free = Number(S.order.freeShippingOver) || 0;
  const ship = goods === 0 ? 0 : free && goods >= free ? 0 : fee;
  return { ls, goods, ship, save: Math.max(0, reg - goods), total: goods + ship };
}
function renderSummary() {
  const t = totals(), st = eventState();
  if (!$('#sumLines')) return;
  $('#sumLines').innerHTML = t.ls.length ? t.ls.map((l) => `<li><span>${esc(l.o.name)} × ${l.q}</span><span>${won(l.sum)}</span></li>`).join('') : '<li>선택한 상품이 없습니다.</li>';
  $('#sumGoods').textContent = won(t.goods);
  $('#sumShip').textContent = t.goods === 0 ? '0원' : t.ship === 0 ? '무료' : won(t.ship);
  $('#sumSave').textContent = '−' + won(t.save);
  $('#sumSaveRow').hidden = !t.save;
  $('#sumTotal').textContent = won(t.total);
  const bb = $('#bbTotal'); if (bb) bb.textContent = t.goods ? '총 ' + won(t.total) : '구성을 골라 주세요';
  const free = Number(S.order.freeShippingOver) || 0, left = free - t.goods;
  $('#shipHint').textContent = !free ? `배송비 ${won(S.order.shippingFee)}` : left > 0 ? `${won(left)} 더 담으시면 무료배송입니다.` : '무료배송이 적용되었습니다.';
  $('#orderBtn').disabled = !t.goods || st !== 'live';
  S.options.forEach((o) => { const el = $(`[data-opt="${CSS.escape(o.id)}"]`); if (!el) return; el.classList.toggle('on', qty[o.id] > 0); const out = $('output', el); if (out) out.textContent = qty[o.id] || 0; });
}
function cardText() {
  const presets = lines(S.messageCard?.presets);
  if (msgSel === 'none') return '';
  if (msgSel === 'custom') return msgCustom.trim();
  return presets[msgSel] || '';
}
function renderCard() {
  const t = $('#mcText'); if (!t) return;
  t.textContent = cardText() || (msgSel === 'custom' ? '전하고 싶은 말을 적어 주세요' : '');
  $('#mcFrom').textContent = msgFrom.trim() ? `— ${msgFrom.trim()} 드림` : '';
  $('#msgCard').hidden = msgSel === 'none';
  $('#msgCustomFld').hidden = msgSel !== 'custom';
  $('#msgFromFld').hidden = msgSel === 'none';
  $$('.msg-chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.msg === String(msgSel))));
}
function orderText() {
  const t = totals(), mc = S.messageCard?.enabled ? cardText() : '';
  return [
    `[${S.brand} ${S.event.name} 주문]`,
    ...t.ls.map((l) => `- ${l.o.name} × ${l.q} = ${won(l.sum)}`),
    `상품 합계: ${won(t.goods)}`,
    `배송비: ${t.ship === 0 ? '무료' : won(t.ship)}`,
    `총 결제금액: ${won(t.total)}`,
    ...(S.messageCard?.enabled ? ['', `메시지 카드: ${mc ? `"${mc}"` : '넣지 않음'}`, ...(mc && msgFrom.trim() ? [`보내는 사람: ${msgFrom.trim()}`] : [])] : []),
    '',
    '받는 분: ', '연락처: ', '주소: ', '입금자명: ', '요청사항: ',
  ].join('\n');
}

let copiedTimer;
function copy(text, msg) {
  const done = () => { const el = $('#copied'); if (el) { el.textContent = msg; clearTimeout(copiedTimer); copiedTimer = setTimeout(() => (el.textContent = ''), 5000); } };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { window.prompt('아래 내용을 복사해 주세요', text); } ta.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

// ───────── 카운트다운 ─────────
function tick() {
  const st = eventState();
  if (lastState && st !== lastState) { renderAll(); return; }
  const target = st === 'before' ? startD() : endD();
  let diff = Math.max(0, target - Date.now());
  const d = Math.floor(diff / 864e5); diff %= 864e5;
  const h = Math.floor(diff / 36e5); diff %= 36e5;
  const m = Math.floor(diff / 6e4), s = Math.floor((diff % 6e4) / 1e3);
  const u = { d, h: pad(h), m: pad(m), s: pad(s) };
  $$('[data-cd] b').forEach((b) => (b.textContent = u[b.dataset.u]));
  const left = (d ? `${d}일 ` : '') + `${pad(h)}:${pad(m)}:${pad(s)}`;
  const txt = st === 'before' ? `오픈까지 ${left}` : st === 'live' ? `종료까지 ${left}` : '행사가 종료되었습니다';
  $$('[data-left]').forEach((e) => (e.textContent = txt));
  $$('[data-cdcap]').forEach((e) => (e.textContent = st === 'before' ? '오픈까지' : '특가 종료까지'));
}

// 하단 주문 바는 첫 화면을 지나면 보여 줍니다

window.addEventListener('scroll', syncBar, { passive: true });

// ───────── 페이지 이벤트 (위임) ─────────
const app = $('#app');
app.addEventListener('click', (e) => {
  const qb = e.target.closest('.qty button');
  if (qb) {
    if (eventState() !== 'live') return;
    const id = qb.closest('[data-opt]').dataset.opt, max = Number(S.order.maxQty) || 20;
    qty[id] = Math.min(max, Math.max(0, (qty[id] || 0) + Number(qb.dataset.d)));
    renderSummary(); return;
  }
  const chip = e.target.closest('.msg-chip');
  if (chip) { const v = chip.dataset.msg; msgSel = v === 'custom' || v === 'none' ? v : Number(v); renderCard(); if (msgSel === 'custom') $('#msgCustom')?.focus(); return; }
  if (e.target.closest('#orderBtn')) {
    const target = S.order.kakaoUrl || S.order.formUrl;
    copy(orderText(), target ? '주문 내용이 복사되었습니다. 열린 창에 붙여넣고 받는 분 정보를 적어 보내 주세요.' : '주문 내용이 복사되었습니다. 문자나 메신저에 붙여넣어 보내 주세요.');
    if (target) window.open(target, '_blank', 'noopener');
    return;
  }
  if (e.target.closest('#copyBank')) { copy(S.order.bank, '계좌번호가 복사되었습니다.'); return; }
  if (editing) {
    const ph = e.target.closest('.ph[data-slot]');
    if (ph) { e.preventDefault(); pickPhoto(ph.dataset.slot); }
  }
});
app.addEventListener('input', (e) => {
  if (e.target.id === 'msgCustom') { msgCustom = e.target.value; renderCard(); }
  if (e.target.id === 'msgFrom') { msgFrom = e.target.value; renderCard(); }
});

      R('copy.points', { label: (it, i) => `포인트 ${i + 1}`, add: '포인트 추가', blank: () => ({ title: '', body: '' }), fields: [F('title', '제목'), F('body', '설명', 'textarea')] }),
      F('copy.mealQuote', '밥상 사진 위 문구', 'textarea'),
      SUB('상품'), F('copy.productsKicker', '작은 머리글'), F('copy.productsTitle', '제목'),
      SUB('신뢰'), F('copy.trustKicker', '작은 머리글'), F('copy.trustTitle', '제목'), F('copy.trustBody', '본문', 'textarea'),
      R('copy.specs', { label: (it, i) => `원재료·품질 ${i + 1}`, add: '항목 추가', blank: () => ({ label: '', value: '' }), fields: [F('label', '항목'), F('value', '내용', 'text', { hint: '실제 사실만 적어 주세요 (예: 100% 국산).' })] }),
      F('copy.factoryTitle', '제조 시설 제목'), F('copy.factoryBody', '제조 시설 설명', 'textarea'),
      F('copy.badges', '인증·수상 (한 줄에 하나, 선택)', 'lines', { hint: '실제로 보유한 것만 적어 주세요. 예: HACCP 인증' }),
      SUB('선물'), F('copy.giftKicker', '작은 머리글'), F('copy.giftTitle', '제목'), F('copy.giftBody', '본문', 'textarea'), F('copy.giftPoints', '선물 특징 (한 줄에 하나)', 'lines'), F('copy.giftCta', '버튼 문구'),
      SUB('주문'), F('copy.orderKicker', '작은 머리글'), F('copy.orderTitle', '제목'),
    ] },
    { t: '⑧ 상품정보 고시 (제품 라벨 그대로)', items: S.products.flatMap((p) => [SUB(p.name), ...(S.productInfo[p.id] || []).map((r, i) => F(`productInfo.${p.id}.${i}.v`, r.k, r.k.includes('원재료') ? 'textarea' : 'text', { req: 1 }))]) },
    { t: '⑨ 사업자 정보', items: [NOTE('직접 판매할 때 전자상거래법상 페이지에 표시해야 하는 정보입니다.'), ...S.business.map((r, i) => F(`business.${i}.v`, r.k, 'text', { req: 1 }))] },
    { t: '⑩ 주문 절차 · 자주 묻는 질문 · 안내', items: [
      R('steps', { fixed: true, label: (it, i) => `주문 ${i + 1}단계`, fields: [F('title', '제목'), F('body', '설명', 'textarea')] }),
      SUB('자주 묻는 질문'),
      R('faq', { label: (it, i) => `질문 ${i + 1}`, add: '질문 추가', blank: () => ({ q: '', a: '' }), fields: [F('q', '질문'), F('a', '답변', 'textarea')] }),
      SUB('안내'), F('notice.shipping', '배송 안내 (한 줄에 하나)', 'lines'), F('notice.refund', '교환·반품 안내 (한 줄에 하나)', 'lines'),
    ] },
  ];
}

let REPS = {};
const openSecs = new Set([0]);

function fieldHTML(f, path) {
  const v = getP(S, path), id = 'f_' + path.replace(/\W/g, '_');
  const attrs = `id="${id}" data-path="${esc(path)}"${f.req ? ' data-req="1"' : ''}${f.contact ? ' data-contact="1"' : ''}`;
  const hint = f.hint ? `<p class="ed-hint">${esc(f.hint)}</p>` : '';
  if (f.type === 'check') return `<div class="ed-f"><label class="ed-chk"><input type="checkbox" ${attrs} data-type="check"${v ? ' checked' : ''}> ${esc(f.label)}</label>${hint}</div>`;
  let input;
  if (f.type === 'textarea') input = `<textarea ${attrs} rows="${f.rows || 3}">${esc(v ?? '')}</textarea>`;
  else if (f.type === 'lines') input = `<textarea ${attrs} data-type="lines" rows="${f.rows || 4}">${esc((Array.isArray(v) ? v : []).join('\n'))}</textarea>`;
  else if (f.type === 'number') input = `<input type="number" inputmode="numeric" min="0" step="${f.step || 100}" ${attrs} data-type="number" value="${v ?? ''}">`;
  else if (f.type === 'datetime') input = `<input type="datetime-local" ${attrs} value="${esc(String(v || '').slice(0, 16))}">`;
  else input = `<input type="${f.type === 'url' ? 'url' : f.type === 'tel' ? 'tel' : 'text'}" ${attrs} value="${esc(v ?? '')}" placeholder="${esc(f.ph || '')}">`;
  return `<div class="ed-f"><label for="${id}">${esc(f.label)}${f.req ? '<i>필수</i>' : ''}</label>${input}${hint}</div>`;
}
function repeatHTML(r) {
  const arr = getP(S, r.path) || [];
  return arr.map((it, i) => `<div class="ed-item"><div class="ed-item-h"><b>${esc(r.label(it, i))}</b>${r.fixed ? '' : `<button type="button" data-act="del" data-rpath="${esc(r.path)}" data-i="${i}">삭제</button>`}</div>${r.fields.map((f) => fieldHTML(f, `${r.path}.${i}.${f.path}`)).join('')}</div>`).join('')
    + (r.fixed ? '' : `<button type="button" class="ed-add" data-act="add" data-rpath="${esc(r.path)}">+ ${esc(r.add)}</button>`);
}
function photosHTML() {
  const total = Object.values(S.photos).filter((v) => String(v).startsWith('data:')).reduce((s, v) => s + v.length * 0.75, 0);
  return Object.entries(SLOTS).map(([k, m]) => {
    const src = S.photos[k] || '';
    return `<div class="ed-ph" data-slot="${k}"><div class="ed-ph-th">${src ? `<img src="${esc(src)}" alt="">` : m.mark}</div><div class="ed-ph-i"><b>${esc(m.label)}</b>${src ? '<span class="ed-ok">✓ 넣음</span>' : ''}<p class="ed-hint">${esc(m.hint)}</p>
      <div class="ed-ph-btns"><button type="button" data-act="pick" data-slot="${k}">📷 사진 고르기</button>${src ? `<button type="button" data-act="rmphoto" data-slot="${k}">지우기</button>` : ''}</div>
      <input type="text" class="ed-ph-path" data-path="photos.${k}" value="${src.startsWith('data:') ? '' : esc(src)}" placeholder="또는 사진 주소 입력 (예: images/${k}.jpg)"></div></div>`;
  }).join('') + `<p class="ed-hint">파일에 들어간 사진 용량: 약 ${(total / 1048576).toFixed(1)}MB</p>`;
}
function itemHTML(it) {
  if (it.photos) return `<div id="edPhotos">${photosHTML()}</div>`;
  if (it.sub) return `<h4 class="ed-sub">${esc(it.sub)}</h4>`;
  if (it.note) return `<p class="ed-note">${esc(it.note)}</p>`;
  if (it.repeat) { REPS[it.path] = it; return `<div data-rep="${esc(it.path)}">${repeatHTML(it)}</div>`; }
  return fieldHTML(it, it.path);
}
function edBodyHTML() {
  REPS = {};
  return schema().map((sec, si) => `<details class="ed-sec" data-si="${si}"${openSecs.has(si) ? ' open' : ''}><summary>${esc(sec.t)}</summary><div class="ed-sec-b">${sec.items.map(itemHTML).join('')}</div></details>`).join('');
}

function buildEditor() {
  if ($('#ed')) return;
  const ed = document.createElement('aside');
  ed.className = 'ed'; ed.id = 'ed'; ed.setAttribute('aria-label', '페이지 편집');
  ed.innerHTML = `<div class="ed-h">
      <div class="ed-t"><b>✎ 랜딩페이지 편집</b><button type="button" data-act="close">편집 끝내기</button></div>
      <div class="ed-st"><span id="edMissing"></span><button type="button" data-act="next">빈칸 찾기 ↓</button></div>
      <div class="ed-act"><button type="button" class="ed-primary" data-act="export">⬇ 완성 파일 내려받기</button><button type="button" data-act="reset">처음 내용으로</button></div>
      <p class="ed-msg" id="edMsg"></p></div>
    <div class="ed-b" id="edBody">${edBodyHTML()}</div>`;
  document.body.appendChild(ed);
  const fab = document.createElement('button');
  fab.className = 'ed-fab'; fab.id = 'edFab'; fab.type = 'button';
  fab.textContent = '👁 미리보기';
  fab.onclick = () => { document.body.classList.toggle('ed-hide'); fab.textContent = document.body.classList.contains('ed-hide') ? '✎ 편집창 열기' : '👁 미리보기'; };
  document.body.appendChild(fab);

  ed.addEventListener('toggle', (e) => { const d = e.target; if (d.matches?.('.ed-sec')) d.open ? openSecs.add(+d.dataset.si) : openSecs.delete(+d.dataset.si); }, true);
  ed.addEventListener('input', onEdInput);
  ed.addEventListener('click', onEdClick);
  updateMissing();
}

function rebuildEditorBody() {
  const b = $('#edBody'); if (!b) return;
  const y = b.scrollTop; b.innerHTML = edBodyHTML(); b.scrollTop = y; updateMissing();
}

let renderTimer;
function changed({ now = false } = {}) {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderAll, now ? 0 : 160);
  updateMissing();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { edMsg('브라우저 임시 저장 공간이 부족합니다. 작업을 잃지 않도록 "완성 파일 내려받기"로 저장해 두세요.', true); }
}

function onEdInput(e) {
  const el = e.target.closest('[data-path]'); if (!el) return;
  const t = el.dataset.type;
  const v = t === 'check' ? el.checked : t === 'number' ? (el.value === '' ? null : Number(el.value)) : t === 'lines' ? el.value.split('\n') : el.value;
  setP(S, el.dataset.path, v);
  if (/^(products\.\d+\.name|options\.\d+\.name)$/.test(el.dataset.path)) { const h = el.closest('.ed-item')?.querySelector('.ed-item-h b'); if (h) h.textContent = el.value; }
  changed();
}

function onEdClick(e) {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'close') return exitEdit();
  if (act === 'export') return doExport();
  if (act === 'next') return gotoNext();
  if (act === 'pick') return pickPhoto(b.dataset.slot);
  if (act === 'rmphoto') { S.photos[b.dataset.slot] = ''; refreshPhotos(); return changed({ now: true }); }
  if (act === 'reset') {
    if (!confirm('지금까지 고친 내용을 모두 지우고 이 파일의 처음 내용으로 되돌릴까요?')) return;
    S = clone(ORIGINAL); try { localStorage.removeItem(STORE_KEY); } catch (_) {}
    rebuildEditorBody(); edMsg('처음 내용으로 되돌렸습니다.'); return changed({ now: true });
  }
  if (act === 'add' || act === 'del') {
    const r = REPS[b.dataset.rpath], arr = getP(S, b.dataset.rpath);
    if (act === 'add') arr.push(r.blank());
    else { if (!confirm('이 항목을 삭제할까요?')) return; const [gone] = arr.splice(+b.dataset.i, 1); if (gone?.id) delete qty[gone.id]; }
    rebuildEditorBody(); return changed({ now: true });
  }
}

function refreshPhotos() { const p = $('#edPhotos'); if (p) p.innerHTML = photosHTML(); }

function pickPhoto(key) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    edMsg('사진을 넣는 중입니다…');
    try {
      S.photos[key] = await shrink(file, SLOTS[key]);
      refreshPhotos(); changed({ now: true });
      edMsg(`"${SLOTS[key].label}"을(를) 넣었습니다.`);
    } catch (err) { edMsg('이 사진을 읽지 못했습니다. JPG 또는 PNG 파일로 다시 골라 주세요. (아이폰 HEIC 사진은 JPG로 바꿔 주세요)', true); }
  };
  inp.click();
}
function shrink(file, slot) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, (slot.max || 1600) / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * sc), h = Math.round(img.naturalHeight * sc);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      if (!slot.png) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); }
      cx.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      resolve(cv.toDataURL(slot.png ? 'image/png' : 'image/jpeg', 0.84));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

function updateMissing() {
  const ed = $('#ed'); if (!ed) return { n: 0, ph: 0 };
  let n = 0;
  $$('[data-req]', ed).forEach((el) => { const empty = !String(el.value).trim(); el.closest('.ed-f').classList.toggle('need', empty); if (empty) n++; });
  const hasContact = ['order.kakaoUrl', 'order.formUrl', 'order.phone'].some((p) => String(getP(S, p) || '').trim());
  $$('[data-contact]', ed).forEach((el) => el.closest('.ed-f').classList.toggle('need', !hasContact));
  if (!hasContact) n++;
  const photoKeys = Object.keys(SLOTS).filter((k) => k !== 'logo');
  const ph = photoKeys.filter((k) => !S.photos[k]).length;
  $('#edMissing').innerHTML = (n ? `필수 빈칸 <b>${n}</b>개 남음` : '<span class="ok">필수 항목 모두 입력 ✓</span>') + ` · 사진 ${photoKeys.length - ph}/${photoKeys.length}`;
  return { n, ph };
}
function gotoNext() {
  const f = $('#ed .ed-f.need');
  if (!f) { edMsg('필수 빈칸이 없습니다. 사진도 모두 넣었는지 확인해 주세요.'); return; }
  const d = f.closest('details'); if (d && !d.open) d.open = true;
  f.scrollIntoView({ block: 'center', behavior: 'smooth' });
  setTimeout(() => $('input,textarea', f)?.focus({ preventScroll: true }), 350);
}
function edMsg(t, warn = false) { const m = $('#edMsg'); if (m) { m.textContent = t; m.classList.toggle('warn', warn); } }

function doExport() {
  const { n, ph } = updateMissing();
  if (n && !confirm(`아직 필수 빈칸이 ${n}개 있습니다. 그래도 내려받을까요?`)) return;
  if (ph && !confirm(`아직 사진 ${ph}장이 비어 있습니다. 그래도 내려받을까요?`)) return;
  if (S.draft && !confirm('"초안 표시"가 켜져 있어 고객에게도 점선 안내가 보입니다.\n고객용 완성본이라면 ①에서 체크를 해제하고 내려받으세요.\n\n그래도 지금 상태로 내려받을까요?')) return;
  const doc = new DOMParser().parseFromString(TEMPLATE, 'text/html');
  doc.getElementById('site-data').textContent = '\n' + JSON.stringify(S, null, 2).replace(/</g, '\\u003c') + '\n';
  updateHead(doc);
  const html = '<!doctype html>\n' + doc.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'index.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  edMsg(`index.html (${(blob.size / 1048576).toFixed(1)}MB)을 내려받았습니다. 사진까지 이 파일 하나에 다 들어 있습니다.`);
}

function enterEdit() {
  if (editing) return;
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved && saved !== JSON.stringify(S) && confirm('이 브라우저에 편집하던 내용이 남아 있습니다. 이어서 편집할까요?\n(취소를 누르면 이 파일에 저장된 내용으로 시작합니다)')) S = JSON.parse(saved);
  } catch (_) {}
  editing = true;
  buildEditor(); renderAll();
}
function exitEdit() {
  editing = false;
  $('#ed')?.remove(); $('#edFab')?.remove();
  document.body.classList.remove('ed-hide');
  if (/edit/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  renderAll();
}
const wantsEdit = () => /(^|[#?&])edit\b/.test(location.hash + '&' + location.search.slice(1));
window.addEventListener('hashchange', () => { if (wantsEdit()) enterEdit(); });

// ───────── 시작 ─────────
if (wantsEdit()) enterEdit(); else renderAll();
setInterval(tick, 1000);
})();
</script>
