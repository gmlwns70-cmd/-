# ─────────────────────────────────────────────────────────────
#  프로그램 설정 파일
#  메모장으로 열어서 값을 바꾸고 저장한 뒤, 프로그램을 다시 실행하면 적용됩니다.
#  (# 뒤의 글은 설명이라서 프로그램이 읽지 않습니다)
# ─────────────────────────────────────────────────────────────

claude:
  # 대본을 쓰는 Claude 모델 이름
  #   claude-sonnet-5-5 : 빠르고 저렴 (기본값)
  #   claude-opus-5-5   : 더 똑똑하지만 비용이 약 2배
  model: claude-sonnet-5-5
  # 생각의 깊이: low / medium / high / xhigh / max  (높을수록 품질↑ 비용·시간↑)
  effort: high
  # 대본 요청이 거절되면 다른 모델로 자동 재시도 (켜두는 것을 권장)
  use_fallback: true
  # 내레이션 1분당 글자 수 (한국어 보통 속도 기준 약 300자)
  chars_per_minute: 300

research:
  region_code: KR          # 검색 국가
  relevance_language: ko   # 검색 언어

tts:
  engine: edge             # edge(무료) / elevenlabs / typecast
  edge_voice: ko-KR-SunHiNeural
  edge_rate: "+0%"         # 말 속도: -50% ~ +50%
  elevenlabs_voice_id: ""  # ElevenLabs 사이트의 Voice ID
  elevenlabs_model: eleven_multilingual_v2
  typecast_voice_id: ""    # 타입캐스트 Voice ID (tc_ 로 시작)
  typecast_model: ssfm-v21
  typecast_endpoint: https://api.typecast.ai/v1/text-to-speech

assets:
  stock_order: [pexels, pixabay]  # 스톡 검색 순서
  max_clips_per_scene: 4
  image_seconds: 5          # 사진 한 장을 보여주는 기본 시간(초)

subtitles:
  max_chars_per_line: 18
  max_lines: 2
  font_size: 54             # 1080p 기준 글자 크기
  stroke_width: 4           # 검은 테두리 두께
  bottom_margin_pct: 10     # 화면 아래에서 몇 % 위에 놓을지
  color: "#FFFFFF"
  stroke_color: "#000000"
  font_file: ""             # 비워두면 fonts 폴더에서 자동 선택

render:
  fps: 30
  scene_padding: 0.35       # 장면 사이 쉬는 시간(초)
  bgm_volume: 0.25          # 말이 없을 때 배경음악 크기
  bgm_duck_volume: 0.07     # 말할 때 배경음악 크기
  on_screen_text_seconds: 3.5
  shorts_max_seconds: 58
  shorts_fit: blur          # blur(흐린 배경 + 가운데 원본) / crop(가운데 잘라서 꽉 채우기)
  preset: medium            # 인코딩 속도: ultrafast / veryfast / medium
