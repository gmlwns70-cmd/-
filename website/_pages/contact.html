<!--
title: 고객 문의
description: 문의대추정원 구매 상담, 단체·선물 주문, 배송 및 상품 문의를 남겨 주세요. 확인 후 농장에서 직접 답변드립니다.
nav: contact
-->
<section class="page-hero">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="현재 위치"><a href="index.html">홈</a><span aria-hidden="true">›</span>고객 문의</nav>
    <h1>고객 문의</h1>
    <p class="lead">구매 상담, 선물·단체 주문, 받으신 상품 문의까지 편하게 남겨 주세요.</p>
  </div>
</section>

<section class="section">
  <div class="wrap split" style="align-items:start">
    <div>
      <h2 style="font-size:24px">연락 방법</h2>
      {{CONTACT_CHANNELS}}
      <div class="notice green mt-l">
        <p><strong>상품 문제 문의 시</strong> 상자 전체, 문제가 있는 대추, 송장 사진을 함께 준비해 주시면 더 빠르게 도와드릴 수 있습니다.</p>
      </div>
      <p class="small text-muted">농사일 중에는 답변이 늦어질 수 있습니다. 남겨 주신 문의는 확인하는 대로 순서대로 답변드립니다.</p>
    </div>
    <div class="form-card">
      <h2 style="font-size:24px">문의 남기기</h2>
      <form class="form" data-result="contact-result" data-form-title="문의대추정원 고객 문의">
        <input type="hidden" name="form" value="contact">
        <div class="field">
          <label for="c-type">문의 유형<span class="req">*</span></label>
          <select id="c-type" name="type" required>
            <option value="">선택해 주세요</option>
            <option value="purchase">구매·예약 상담</option>
            <option value="gift">선물·단체 주문</option>
            <option value="delivery">배송 문의</option>
            <option value="product">받은 상품 문의 (교환·환불)</option>
            <option value="etc">기타</option>
          </select>
          <p class="error" role="alert"></p>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="c-name">성함<span class="req">*</span></label>
            <input id="c-name" name="name" type="text" autocomplete="name" required>
            <p class="error" role="alert"></p>
          </div>
          <div class="field">
            <label for="c-phone">연락처<span class="req">*</span></label>
            <input id="c-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" required>
            <p class="error" role="alert"></p>
          </div>
        </div>
        <div class="field">
          <label for="c-email">이메일 (선택)</label>
          <input id="c-email" name="email" type="email" autocomplete="email">
        </div>
        <div class="field">
          <label for="c-msg">문의 내용<span class="req">*</span></label>
          <textarea id="c-msg" name="message" required></textarea>
          <p class="error" role="alert"></p>
        </div>
        {{CONSENT_CONTACT}}
        <button class="btn btn-primary btn-block" type="submit">문의 보내기</button>
      </form>
      <div class="result-panel mt-l" id="contact-result" aria-live="polite"></div>
    </div>
  </div>
</section>
