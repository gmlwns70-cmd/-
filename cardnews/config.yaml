# ─────────────────────────────────────────────────────────────
#  카드뉴스 설정 파일
#  메모장으로 열어 값을 바꾸고 저장하면 됩니다.
#  명령어에 --topic 같은 값을 직접 쓰면 그 값이 이 파일보다 우선합니다.
#  (# 뒤의 글은 설명이라서 프로그램이 읽지 않습니다)
# ─────────────────────────────────────────────────────────────

topic: ""                     # 주제 (예: 줄 서던 가게가 금방 조용해지는 이유)
target: "자영업 사장님"         # 핵심 타깃
brand: "@my_brand"            # 브랜드명/계정명
cards: 15                     # 카드 장수 (10~15)

# 모든 일러스트에 똑같이 등장하는 고정 캐릭터
character: "30대 한국인 여성 사장님, 갈색 올림머리, 연분홍 셔츠, 베이지 앞치마"

claude:
  model: claude-opus-5-5      # 원고를 쓰는 Claude 모델
  effort: high                # 생각의 깊이: low / medium / high / xhigh / max
  use_fallback: true          # 요청이 거절되면 다른 모델로 자동 재시도
  max_searches: 8             # 사실 검증용 웹 검색 최대 횟수

style:
  cover_size: 80              # 표지 제목 글자 크기(px)
  text_size: 70               # 텍스트 카드 글자 크기(px, 64~72 권장)
  illustrated_size: 64        # 일러스트 카드 글자 크기(px)
  min_size: 52                # 이보다 작게는 줄이지 않고 경고
  line_height: 1.3            # 행간
  line_max_chars: 13          # 한 줄 권장 글자 수 (공백 제외)
  line_tolerance: 1           # 이만큼 넘는 것까지는 봐줌 (13+1=14자)
  illustration_ratio: 0.4     # 전체 카드 중 일러스트 비율
